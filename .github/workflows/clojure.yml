name: Clojure CI

on:
  push:
    branches: [ 3.x ]
  pull_request:
    branches: [ 3.x ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["14", "17", "21", "25"]
        clojure: ["1.8", "1.9", "1.10", "1.11", "1.12"]

    name: Java ${{ matrix.java }} Clojure ${{ matrix.clojure }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-lein-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-lein-

    - name: Setup java
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: ${{ matrix.java }}

    - name: Install dependencies
      run: lein deps

    - name: Run tests
      run: lein with-profile dev,${{matrix.clojure}} test :all

    - name: Check Reflection Warnings
      run:  '! lein with-profile dev,${{matrix.clojure}} check 2>&1 | egrep "Reflection warning|Performance warning" | egrep "clj_http/"'
